name: Check-Outputs
description: Check the output parameters of the 'SynchronizeForks' action against their expected values.
inputs:
  synchronized:
    description: Actual number of synchronized branches.
    type: string
    required: true
  created:
    description: Actual number of created branches.
    type: string
    required: true
  skipped:
    description: Actual number of skipped entries.
    type: string
    required: true
  errors:
    description: Actual number of errors.
    type: string
    required: true
  expected-synchronized:
    description: Expected number of synchronized branches.
    type: string
    required: true
  expected-created:
    description: Expected number of created branches.
    type: string
    required: true
  expected-skipped:
    description: Expected number of skipped entries.
    type: string
    required: true
  expected-errors:
    description: Expected number of errors.
    type: string
    required: true

runs:
  using: composite
  steps:
    - name: 📋 Verify output parameters
      shell: bash
      env:
        SYNCHRONIZED:          ${{ inputs.synchronized }}
        CREATED:               ${{ inputs.created }}
        SKIPPED:               ${{ inputs.skipped }}
        ERRORS:                ${{ inputs.errors }}
        EXPECTED_SYNCHRONIZED: ${{ inputs.expected-synchronized }}
        EXPECTED_CREATED:      ${{ inputs.expected-created }}
        EXPECTED_SKIPPED:      ${{ inputs.expected-skipped }}
        EXPECTED_ERRORS:       ${{ inputs.expected-errors }}
      run: |
        # 📋 Verify output parameters
        set +e

        ANSI_LIGHT_RED=$'\x1b[91m'
        ANSI_LIGHT_GREEN=$'\x1b[92m'
        ANSI_NOCOLOR=$'\x1b[0m'

        errors=0
        checkOutput() {
          local name="${1}" actual="${2}" expected="${3}"

          printf "%s" "Checking output parameter '${name}' ... "
          if [[ "${actual}" == "${expected}" ]]; then
            printf "%s\n" "${ANSI_LIGHT_GREEN}[PASSED]${ANSI_NOCOLOR} (${actual})"
          else
            printf "%s\n" "${ANSI_LIGHT_RED}[FAILED]${ANSI_NOCOLOR} (expected '${expected}', got '${actual}')"
            printf "::error title=%s::%s\n" "check-outputs" "Output parameter '${name}' is '${actual}', but '${expected}' was expected."
            errors=$((errors + 1))
          fi
        }

        checkOutput "synchronized" "${SYNCHRONIZED}" "${EXPECTED_SYNCHRONIZED}"
        checkOutput "created"      "${CREATED}"      "${EXPECTED_CREATED}"
        checkOutput "skipped"      "${SKIPPED}"      "${EXPECTED_SKIPPED}"
        checkOutput "errors"       "${ERRORS}"       "${EXPECTED_ERRORS}"

        printf "%s\n" ""
        if [[ ${errors} -ne 0 ]]; then
          printf "%s\n" "${ANSI_LIGHT_RED}Counted ${errors} errors.${ANSI_NOCOLOR}"
          exit 1
        else
          printf "%s\n" "${ANSI_LIGHT_GREEN}No errors found.${ANSI_NOCOLOR}"
        fi
