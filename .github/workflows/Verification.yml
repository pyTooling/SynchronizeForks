name: Verification of the Synchronize Forks Action

on:
  push:
  workflow_dispatch:

jobs:
  DryRun:
    name: 🐧 Dry-run with a valid configuration
    runs-on: ubuntu-26.04

    steps:
      - name: ⏬ Checkout repository to use the local action
        uses: actions/checkout@v7

      - name: 🔄 Synchronize forked repositories
        id: synchronize
        uses: ./
        with:
          github-token: ${{ github.token }}
          target-organisation: Paebbels
          directory: tests/Valid
          dry-run: true

      - name: 📋 Verify output parameters
        uses: ./.github/actions/check-outputs
        with:
          synchronized:          ${{ steps.synchronize.outputs.synchronized }}
          created:               ${{ steps.synchronize.outputs.created }}
          created-tags:          ${{ steps.synchronize.outputs.created-tags }}
          skipped:               ${{ steps.synchronize.outputs.skipped }}
          errors:                ${{ steps.synchronize.outputs.errors }}
          # 1 branch of 'ghdl' + 1 branch of 'progit2' + 2 branches of 'itertree'
          expected-synchronized: 4
          # 1 commented out organisation + 1 commented out repository
          # Dry-run reads no repository, so no branch is created.
          expected-created:      0
          # Dry-run reads no repository, so no tag is created.
          expected-created-tags: 0
          expected-skipped:      2
          expected-errors:       0

  ErrorHandling:
    name: 🐧 Error handling with an invalid configuration
    runs-on: ubuntu-26.04

    steps:
      - name: ⏬ Checkout repository to use the local action
        uses: actions/checkout@v7

      - name: 🔄 Synchronize forked repositories
        id: synchronize
        uses: ./
        with:
          github-token: ${{ github.token }}
          target-organisation: Paebbels
          directory: tests/Invalid
          dry-run: true
          fail-on-error: false

      - name: 📋 Verify output parameters
        uses: ./.github/actions/check-outputs
        with:
          synchronized:          ${{ steps.synchronize.outputs.synchronized }}
          created:               ${{ steps.synchronize.outputs.created }}
          created-tags:          ${{ steps.synchronize.outputs.created-tags }}
          skipped:               ${{ steps.synchronize.outputs.skipped }}
          errors:                ${{ steps.synchronize.outputs.errors }}
          expected-synchronized: 1
          expected-created:      0
          expected-created-tags: 0
          expected-skipped:      0
          # 1 missing 'Missing.repos' + 4 malformed lines in 'ghdl.repos'
          expected-errors:       5

  FailOnError:
    name: 🐧 Counted errors let the action fail
    runs-on: ubuntu-26.04

    steps:
      - name: ⏬ Checkout repository to use the local action
        uses: actions/checkout@v7

      - name: 🔄 Synchronize forked repositories
        id: synchronize
        continue-on-error: true
        uses: ./
        with:
          github-token: ${{ github.token }}
          target-organisation: Paebbels
          directory: tests/Invalid
          dry-run: true

      - name: 📋 Verify the action failed
        shell: bash
        env:
          OUTCOME: ${{ steps.synchronize.outcome }}
        run: |
          # 📋 Verify the action failed
          set +e

          ANSI_LIGHT_RED=$'\x1b[91m'
          ANSI_LIGHT_GREEN=$'\x1b[92m'
          ANSI_NOCOLOR=$'\x1b[0m'

          printf "%s" "Checking the action's outcome ... "
          if [[ "${OUTCOME}" == "failure" ]]; then
            printf "%s\n" "${ANSI_LIGHT_GREEN}[PASSED]${ANSI_NOCOLOR} (failure)"
          else
            printf "%s\n" "${ANSI_LIGHT_RED}[FAILED]${ANSI_NOCOLOR} (expected 'failure', got '${OUTCOME}')"
            printf "::error title=%s::%s\n" "FailOnError" "The action's outcome is '${OUTCOME}', but 'failure' was expected."
            exit 1
          fi
