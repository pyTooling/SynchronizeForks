name: 🔄 Synchronize Forked Repositories
branding:
  icon: refresh-cw
  color: yellow
description: Synchronize branches and tags of forked repositories in a GitHub namespace with their upstream repositories.
author: Patrick Lehmann (@Paebbels)

inputs:
  github-token:
    description: |
      GitHub token used to synchronize the forked repositories.
      It needs write access to the contents of every listed fork. The workflow's automatic 'GITHUB_TOKEN' is not
      sufficient, because it is scoped to the repository the workflow is running in.
    type: string
    required: true
  target-organisation:
    description: |
      GitHub organisation or user account owning the forked repositories.
    type: string
    required: false
    default: ${{ github.repository_owner }}
  directory:
    description: |
      Directory containing the configuration files.
    type: string
    required: false
    default: '.'
  index-file:
    description: |
      Name of the index file listing the organisations to be synchronized.
      For every listed organisation, a matching '<organisation>.repos' file is read from the same directory.
    type: string
    required: false
    default: '.ALL.repos'
  force:
    description: |
      Hard reset the fork's branch to the upstream branch, discarding commits that aren't in the upstream repository.
    type: boolean
    required: false
    default: false
  create-missing-branches:
    description: |
      Create a branch that is listed in an '<organisation>.repos' file, but doesn't exist in the fork yet, from the
      upstream repository's branch head. 'gh repo sync' can only update an existing branch.
      The branch head is read from '<upstream>', so this is disabled by default: a stale or copy-pasted upstream in a
      configuration file would create the branch from the wrong repository.
    type: boolean
    required: false
    default: false
  dry-run:
    description: |
      Print the synchronization commands instead of running them.
      Branches that would have been synchronized are counted in the 'synchronized' output parameter. No repository is
      read or written, so a missing branch isn't detected in this mode.
    type: boolean
    required: false
    default: false
  fail-on-error:
    description: |
      Let the action fail if at least one error was counted.
    type: boolean
    required: false
    default: true

outputs:
  synchronized:
    description: |
      Number of successfully synchronized branches.
    value: ${{ steps.synchronize.outputs.synchronized }}
  created:
    description: |
      Number of branches created in a fork.
    value: ${{ steps.synchronize.outputs.created }}
  created-tags:
    description: |
      Number of tags created in a fork.
    value: ${{ steps.synchronize.outputs.created-tags }}
  skipped:
    description: |
      Number of skipped organisations and repositories (commented out lines).
    value: ${{ steps.synchronize.outputs.skipped }}
  errors:
    description: |
      Number of counted errors.
    value: ${{ steps.synchronize.outputs.errors }}

runs:
  using: composite
  steps:
    - name: ☑ Check GitHub CLI
      shell: bash
      run: |
        # ☑ Check GitHub CLI
        set +e

        ANSI_LIGHT_RED=$'\x1b[91m'
        ANSI_LIGHT_GREEN=$'\x1b[92m'
        ANSI_NOCOLOR=$'\x1b[0m'

        printf "%s" "Checking GitHub CLI 'gh' ... "
        if ! command -v gh > /dev/null; then
          printf "%s\n" "${ANSI_LIGHT_RED}[MISSING]${ANSI_NOCOLOR}"
          printf "::error title=%s::%s\n" "pyTooling/SynchronizeForks" "GitHub CLI 'gh' isn't installed on this runner."
          exit 1
        fi
        printf "%s\n" "${ANSI_LIGHT_GREEN}[FOUND]${ANSI_NOCOLOR}"
        printf "  %s\n" "$(gh --version | head -n 1)"

    - name: 🔄 Synchronize forked repositories
      id: synchronize
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        GH_TOKEN:            ${{ inputs.github-token }}
        TARGET_ORGANISATION: ${{ inputs.target-organisation }}
        INDEX_FILE:          ${{ inputs.index-file }}
        FORCE:               ${{ inputs.force }}
        CREATE_BRANCHES:     ${{ inputs.create-missing-branches }}
        DRY_RUN:             ${{ inputs.dry-run }}
        FAIL_ON_ERROR:       ${{ inputs.fail-on-error }}
      run: |
        # 🔄 Synchronize forked repositories
        set +e

        ANSI_CYAN=$'\x1b[36m'
        ANSI_LIGHT_RED=$'\x1b[91m'
        ANSI_LIGHT_GREEN=$'\x1b[92m'
        ANSI_LIGHT_YELLOW=$'\x1b[93m'
        ANSI_LIGHT_BLUE=$'\x1b[94m'
        ANSI_NOCOLOR=$'\x1b[0m'

        printf "%s\n" "See also: https://docs.github.com/en/pull-requests/collaborating-with-pull-requests/working-with-forks/syncing-a-fork"
        printf "%s\n" ""
        printf "%s\n"          "${ANSI_CYAN}Synchronizing forked repositories of '${TARGET_ORGANISATION}' ...${ANSI_NOCOLOR}"
        printf "  %-20s%s\n"   "Directory:"  "$(pwd)"
        printf "  %-20s%s\n"   "Index file:" "${INDEX_FILE}"
        printf "  %-20s%s\n"   "Force:"      "${FORCE}"
        printf "  %-20s%s\n"   "Dry-run:"    "${DRY_RUN}"
        printf "%s\n" ""

        synchronized=0
        created=0
        createdTags=0
        skipped=0
        errors=0
        failures=()

        # Create a branch in the fork, pointing at the upstream repository's branch head. GitHub keeps a fork and its
        # upstream in one object network, so the upstream's commit is addressable through the fork and no clone,
        # fetch or push is involved. 'gh repo sync' can only fast-forward a branch that already exists.
        createBranch() {
          local upstream="${1}" fork="${2}" branch="${3}"
          local sha messages

          sha="$(gh api "repos/${upstream}/git/ref/heads/${branch}" --jq '.object.sha' 2>&1)"
          if [[ $? -ne 0 ]]; then
            printf "    ❌ %s\n" "${ANSI_LIGHT_RED}${branch} — exists neither in the fork nor in '${upstream}'${ANSI_NOCOLOR}"
            printf "::error title=%s::%s\n" "Create ${fork}:${branch}" "Branch '${branch}' exists neither in the fork '${fork}' nor in the upstream repository '${upstream}'."
            return 1
          fi

          messages="$(gh api --method POST "repos/${fork}/git/refs" --field "ref=refs/heads/${branch}" --field "sha=${sha}" 2>&1)"
          if [[ $? -ne 0 ]]; then
            printf "    ❌ %s\n" "${ANSI_LIGHT_RED}${branch} — couldn't be created from ${upstream}@${sha:0:7}${ANSI_NOCOLOR}"
            printf "%s\n" "$(sed 's/^/    ↪ /g' <<< "${messages}")"
            printf "::error title=%s::%s\n" "Create ${fork}:${branch}" "${messages//$'\n'/%0A}"
            return 1
          fi

          printf "    🌱 %s\n" "${ANSI_LIGHT_GREEN}${branch} — created from ${upstream}@${sha:0:7}${ANSI_NOCOLOR}"
          created=$((created + 1))
          return 0
        }

        # 'grep -P' is what makes a tag pattern a regular expression. GNU grep rejects several '-e' patterns together
        # with '-P', so the patterns of one line are joined into a single alternation instead.
        pcre="true"
        printf "%s" "x" | grep -qxP "x" 2> /dev/null || pcre="false"

        # Resolve a tag to the commit it points at, and that commit's date, as '<sha> <date>'. The 'commits' endpoint
        # dereferences an annotated tag, which is why it's asked by tag name: the tag ref's object SHA is the tag
        # object for an annotated tag, and the endpoint rejects it.
        resolveTag() {
          gh api "repos/${1}/commits/${2}" --jq '.sha + " " + .commit.committer.date' 2> /dev/null
        }

        # '2026-09-10T21:37:37Z' -> '2026-09-10 21:37:37 UTC'. Done with parameter expansion rather than 'date', which
        # parses the input only in its GNU flavour.
        formatDate() {
          local value="${1}"

          if [[ -z "${value}" ]]; then
            printf "%s" "date unknown"
          else
            value="${value/T/ }"
            printf "%s UTC" "${value%Z}"
          fi
        }

        # Synchronize tags from the upstream repository into the fork. 'gh repo sync' knows branches only, so the tag
        # refs are compared and created through the API. A tag that moved upstream is reported, never rewritten.
        synchronizeTags() {
          local upstream="${1}" fork="${2}" patterns="${3}"
          local pattern expression name sha forkSHA upstreamTags forkTags matchedTags messages upToDate=0
          local forkCommit forkDate upstreamCommit upstreamDate
          local -a patternList=() upstreamTagNames=()
          local -A upstreamTagSHAs=() forkTagSHAs=()

          if [[ "${pcre}" != "true" ]]; then
            printf "    ❌ %s\n" "${ANSI_LIGHT_RED}tag patterns need a 'grep' with '-P' (PCRE) support${ANSI_NOCOLOR}"
            printf "::error title=%s::%s\n" "Synchronize tags of ${fork}" "Tag patterns are matched with 'grep -P', which this runner's 'grep' doesn't support."
            return 1
          fi

          IFS="," read -r -a patternList <<< "${patterns}"
          for pattern in "${patternList[@]}"; do
            [[ -z "${pattern}" ]] && continue
            expression="${expression:+${expression}|}(${pattern})"
          done

          upstreamTags="$(gh api "repos/${upstream}/git/matching-refs/tags" --paginate --jq '.[] | (.ref | sub("refs/tags/"; "")) + " " + .object.sha' 2>&1)"
          if [[ $? -ne 0 ]]; then
            printf "    ❌ %s\n" "${ANSI_LIGHT_RED}couldn't read the tags of '${upstream}'${ANSI_NOCOLOR}"
            printf "%s\n" "$(sed 's/^/    ↪ /g' <<< "${upstreamTags}")"
            printf "::error title=%s::%s\n" "Synchronize tags of ${fork}" "${upstreamTags//$'\n'/%0A}"
            return 1
          fi

          forkTags="$(gh api "repos/${fork}/git/matching-refs/tags" --paginate --jq '.[] | (.ref | sub("refs/tags/"; "")) + " " + .object.sha' 2>&1)"
          if [[ $? -ne 0 ]]; then
            printf "    ❌ %s\n" "${ANSI_LIGHT_RED}couldn't read the tags of '${fork}'${ANSI_NOCOLOR}"
            printf "%s\n" "$(sed 's/^/    ↪ /g' <<< "${forkTags}")"
            printf "::error title=%s::%s\n" "Synchronize tags of ${fork}" "${forkTags//$'\n'/%0A}"
            return 1
          fi

          while read -r name sha; do
            [[ -z "${name}" ]] && continue
            upstreamTagSHAs["${name}"]="${sha}"
            upstreamTagNames+=("${name}")
          done <<< "${upstreamTags}"

          while read -r name sha; do
            [[ -z "${name}" ]] && continue
            forkTagSHAs["${name}"]="${sha}"
          done <<< "${forkTags}"

          if [[ ${#upstreamTagNames[@]} -eq 0 ]]; then
            printf "    ℹ️ %s\n" "${ANSI_LIGHT_YELLOW}'${upstream}' has no tags${ANSI_NOCOLOR}"
            return 0
          fi

          matchedTags="$(printf "%s\n" "${upstreamTagNames[@]}" | grep -xP "${expression}")"
          if [[ -z "${matchedTags}" ]]; then
            printf "    ℹ️ %s\n" "${ANSI_LIGHT_YELLOW}no tag of '${upstream}' matches '${patterns}'${ANSI_NOCOLOR}"
            return 0
          fi

          while read -r name; do
            [[ -z "${name}" ]] && continue
            sha="${upstreamTagSHAs[${name}]}"
            forkSHA="${forkTagSHAs[${name}]:-}"

            if [[ -n "${forkSHA}" ]]; then
              if [[ "${forkSHA}" == "${sha}" ]]; then
                upToDate=$((upToDate + 1))
              else
                # Rewriting a tag would discard whatever the fork's tag points at, so it's reported and left alone.
                # Both sides are resolved to a commit, so the report says what each tag points at and since when.
                read -r forkCommit forkDate <<< "$(resolveTag "${fork}" "${name}")"
                read -r upstreamCommit upstreamDate <<< "$(resolveTag "${upstream}" "${name}")"
                forkCommit="${forkCommit:-${forkSHA}}"
                upstreamCommit="${upstreamCommit:-${sha}}"

                printf "    ☢️ %s\n" "${ANSI_LIGHT_RED}${name} — moved in '${upstream}'${ANSI_NOCOLOR}"
                printf "      ↪ %-10s%s  %s\n" "fork:"     "${forkCommit:0:7}"     "$(formatDate "${forkDate}")"
                printf "      ↪ %-10s%s  %s\n" "upstream:" "${upstreamCommit:0:7}" "$(formatDate "${upstreamDate}")"
                if [[ "${forkCommit}" == "${upstreamCommit}" ]]; then
                  printf "      ↪ %s\n" "${ANSI_LIGHT_YELLOW}same commit — the tag object itself was recreated${ANSI_NOCOLOR}"
                fi
                printf "::error title=%s::%s\n" "Tag ${fork}:${name}" "Tag '${name}' points at commit ${forkCommit} ($(formatDate "${forkDate}")) in the fork, but at ${upstreamCommit} ($(formatDate "${upstreamDate}")) in '${upstream}'. A moved tag isn't rewritten."
                failures+=("☢️ ${upstream} ⇒ ${fork}:${name} (moved)")
                errors=$((errors + 1))
              fi
              continue
            fi

            messages="$(gh api --method POST "repos/${fork}/git/refs" --field "ref=refs/tags/${name}" --field "sha=${sha}" 2>&1)"
            if [[ $? -ne 0 ]]; then
              printf "    ❌ %s\n" "${ANSI_LIGHT_RED}${name} — couldn't be created from ${upstream}@${sha:0:7}${ANSI_NOCOLOR}"
              printf "%s\n" "$(sed 's/^/    ↪ /g' <<< "${messages}")"
              printf "::error title=%s::%s\n" "Tag ${fork}:${name}" "${messages//$'\n'/%0A}"
              failures+=("❌ ${upstream} ⇒ ${fork}:${name}")
              errors=$((errors + 1))
              continue
            fi

            printf "    🏷️ %s\n" "${ANSI_LIGHT_GREEN}${name} — created from ${upstream}@${sha:0:7}${ANSI_NOCOLOR}"
            createdTags=$((createdTags + 1))
          done <<< "${matchedTags}"

          if [[ ${upToDate} -gt 0 ]]; then
            printf "    🟰 %s\n" "${upToDate} tag(s) already up to date"
          fi
          return 0
        }

        if [[ ! -f "${INDEX_FILE}" ]]; then
          printf "%s\n" "${ANSI_LIGHT_RED}Index file '${INDEX_FILE}' not found in '$(pwd)'.${ANSI_NOCOLOR}"
          printf "::error title=%s::%s\n" "pyTooling/SynchronizeForks" "Index file '${INDEX_FILE}' not found in '$(pwd)'."
          errors=$((errors + 1))
        else
          # Iterate the organisations listed in the index file. A missing final newline is handled by the second
          # condition, otherwise 'read' would discard the last line.
          while IFS= read -r organisation || [[ -n "${organisation}" ]]; do
            # Support configuration files with Windows line endings.
            organisation="${organisation%$'\r'}"

            # Skip empty lines.
            [[ -z "${organisation}" ]] && continue

            # Skip commented out organisations.
            if [[ "${organisation:0:1}" == "#" ]]; then
              printf "🚫 %s\n" "${ANSI_LIGHT_YELLOW}${organisation}${ANSI_NOCOLOR}"
              skipped=$((skipped + 1))
              continue
            fi

            printf "::group::🏭 %s\n" "${ANSI_LIGHT_BLUE}${organisation}${ANSI_NOCOLOR}"

            repositoryFile="${organisation}.repos"
            if [[ ! -f "${repositoryFile}" ]]; then
              printf "  ❌ %s\n" "${ANSI_LIGHT_RED}Configuration file '${repositoryFile}' not found.${ANSI_NOCOLOR}"
              printf "::error title=%s::%s\n" "pyTooling/SynchronizeForks" "Configuration file '${repositoryFile}' not found in '$(pwd)'."
              errors=$((errors + 1))
              printf "::endgroup::\n"
              continue
            fi

            while IFS= read -r line || [[ -n "${line}" ]]; do
              line="${line%$'\r'}"

              [[ -z "${line}" ]] && continue

              # Skip commented out repositories.
              if [[ "${line:0:1}" == "#" ]]; then
                printf "  🚫 %s\n" "${ANSI_LIGHT_YELLOW}${line}${ANSI_NOCOLOR}"
                skipped=$((skipped + 1))
                continue
              fi

              # A repository line is formatted '<upstream>=<fork>:<branch>[,<branch>...][:<tag>[,<tag>...]]'.
              upstream="${line%%=*}"
              fork="${line#*=}"
              repository="${fork%%:*}"
              remainder="${fork#*:}"
              branchList="${remainder%%:*}"
              if [[ "${remainder}" == *":"* ]]; then
                tagPatterns="${remainder#*:}"
              else
                tagPatterns=""
              fi

              if [[ "${line}" != *"="* || "${fork}" != *":"* || -z "${upstream}" || -z "${repository}" || ( -z "${branchList//,/}" && -z "${tagPatterns//,/}" ) ]]; then
                printf "  ❌ %s\n" "${ANSI_LIGHT_RED}${line}${ANSI_NOCOLOR}"
                printf "    ↪ %s\n" "${ANSI_LIGHT_RED}Expected format: <upstream>=<fork>:<branch>[,<branch>][:<tag>[,<tag>]]${ANSI_NOCOLOR}"
                printf "::error title=%s::%s\n" "pyTooling/SynchronizeForks" "Malformed line in '${repositoryFile}': '${line}'."
                errors=$((errors + 1))
                continue
              fi

              IFS="," read -r -a branches <<< "${branchList}"

              printf "  📂 %s ⇒ %s\n" "${upstream}" "${TARGET_ORGANISATION}/${repository}"

              for branch in "${branches[@]}"; do
                [[ -z "${branch}" ]] && continue

                syncCommand=(gh repo sync "${TARGET_ORGANISATION}/${repository}" --branch "${branch}")
                [[ "${FORCE}" == "true" ]] && syncCommand+=(--force)

                if [[ "${DRY_RUN}" == "true" ]]; then
                  printf "    🚧 %s\n" "${ANSI_LIGHT_YELLOW}${syncCommand[*]}${ANSI_NOCOLOR}"
                  synchronized=$((synchronized + 1))
                  continue
                fi

                # A branch that doesn't exist in the fork can't be synchronized — 'gh repo sync' updates a branch, it
                # doesn't create one. Create it here, so the next run synchronizes it like any other branch.
                if ! gh api "repos/${TARGET_ORGANISATION}/${repository}/git/ref/heads/${branch}" > /dev/null 2>&1; then
                  if [[ "${CREATE_BRANCHES}" == "true" ]]; then
                    createBranch "${upstream}" "${TARGET_ORGANISATION}/${repository}" "${branch}"
                    if [[ $? -ne 0 ]]; then
                      failures+=("❌ ${upstream} ⇒ ${TARGET_ORGANISATION}/${repository}:${branch}")
                      errors=$((errors + 1))
                    fi
                  else
                    printf "    ❌ %s\n" "${ANSI_LIGHT_RED}${branch} — doesn't exist in the fork${ANSI_NOCOLOR}"
                    printf "    ↪ %s\n" "${ANSI_LIGHT_RED}enable 'create-missing-branches' to create it${ANSI_NOCOLOR}"
                    printf "::error title=%s::%s\n" "Synchronize ${upstream} ⇒ ${TARGET_ORGANISATION}/${repository}:${branch}" "Branch '${branch}' doesn't exist in the fork. Enable 'create-missing-branches' to create it from '${upstream}'."
                    failures+=("❌ ${upstream} ⇒ ${TARGET_ORGANISATION}/${repository}:${branch}")
                    errors=$((errors + 1))
                  fi
                  continue
                fi

                messages="$("${syncCommand[@]}" 2>&1)"
                if [[ $? -eq 0 ]]; then
                  printf "    ✅ %s\n" "${syncCommand[*]}"
                  synchronized=$((synchronized + 1))
                else
                  printf "    ❌ %s\n" "${ANSI_LIGHT_RED}${syncCommand[*]}${ANSI_NOCOLOR}"
                  printf "%s\n" "$(sed 's/^/    ↪ /g' <<< "${messages}")"
                  # A workflow command is a single line, so embedded newlines are escaped as '%0A'.
                  printf "::error title=%s::%s\n" "Synchronize ${upstream} ⇒ ${TARGET_ORGANISATION}/${repository}:${branch}" "${messages//$'\n'/%0A}"
                  failures+=("❌ ${upstream} ⇒ ${TARGET_ORGANISATION}/${repository}:${branch}")
                  errors=$((errors + 1))
                fi
              done

              if [[ -n "${tagPatterns//,/}" ]]; then
                if [[ "${DRY_RUN}" == "true" ]]; then
                  printf "    🚧 %s\n" "${ANSI_LIGHT_YELLOW}synchronize tags matching '${tagPatterns}'${ANSI_NOCOLOR}"
                else
                  synchronizeTags "${upstream}" "${TARGET_ORGANISATION}/${repository}" "${tagPatterns}"
                  if [[ $? -ne 0 ]]; then
                    failures+=("❌ ${upstream} ⇒ ${TARGET_ORGANISATION}/${repository} (tags)")
                    errors=$((errors + 1))
                  fi
                fi
              fi
            done < "${repositoryFile}"

            printf "::endgroup::\n"
          done < "${INDEX_FILE}"
        fi

        printf "%s\n" ""
        printf "%s\n"        "${ANSI_CYAN}Summary:${ANSI_NOCOLOR}"
        printf "  %-24s%s\n" "Synchronized branches:" "${synchronized}"
        printf "  %-24s%s\n" "Created branches:"      "${created}"
        printf "  %-24s%s\n" "Created tags:"          "${createdTags}"
        printf "  %-24s%s\n" "Skipped entries:"       "${skipped}"
        printf "  %-24s%s\n" "Errors:"                "${errors}"

        if [[ ${#failures[@]} -gt 0 ]]; then
          printf "%s\n" ""
          printf "%s\n"   "${ANSI_CYAN}Not synchronized:${ANSI_NOCOLOR}"
          printf "  %s\n" "${failures[@]}"
        fi

        printf "synchronized=%s\n" "${synchronized}" >> "${GITHUB_OUTPUT}"
        printf "created=%s\n"      "${created}"      >> "${GITHUB_OUTPUT}"
        printf "created-tags=%s\n" "${createdTags}"  >> "${GITHUB_OUTPUT}"
        printf "skipped=%s\n"      "${skipped}"      >> "${GITHUB_OUTPUT}"
        printf "errors=%s\n"       "${errors}"       >> "${GITHUB_OUTPUT}"

        printf "%s\n" ""
        if [[ ${errors} -gt 0 ]]; then
          printf "%s\n" "${ANSI_LIGHT_RED}Counted ${errors} errors.${ANSI_NOCOLOR}"
          if [[ "${FAIL_ON_ERROR}" == "true" ]]; then
            exit 1
          fi
        else
          printf "%s\n" "${ANSI_LIGHT_GREEN}No errors found.${ANSI_NOCOLOR}"
        fi
